<div style="display:flex;align-items:center;justify-content:space-between;
            padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;">
    <span style="color:var(--gray);display:flex;align-items:center;gap:8px;">
        <i class="{{ icon }}" style="color:var(--primary);width:16px;"></i>
        {{ label }}
    </span>
    <span style="color:var(--dark);font-weight:600;">{{ value }}</span>
</div>
